name: Build LQMasterOptimizer APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: 4. Chấp nhận giấy phép Android SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: 5. Tự động tạo Keystore
        run: |
          keytool -genkeypair -v -keystore app/release.keystore -alias lqmaster -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=LQ Master, OU=Dev, O=Apex, L=Hanoi, S=Hanoi, C=VN"

      - name: 6. Build APK Release
        run: gradle assembleRelease

      - name: 7. Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LQMasterOptimizer-APK
          # ĐƯỜNG DẪN NÀY PHẢI KHỚP VỚI TÊN FILE TRONG app/build.gradle
          path: app/build/outputs/apk/release/LQMasterOptimizer_v1.0.0.apk
