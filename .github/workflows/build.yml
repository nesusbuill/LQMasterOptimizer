name: Build LQ Master Optimizer APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Cho phép sếp bấm chạy thủ công trên GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Chấp nhận giấy phép Android SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: 4. Cấp quyền thực thi cho gradlew
        run: chmod +x gradlew

      - name: 5. Tự động tạo Keystore để ký APK
        run: |
          keytool -genkeypair -v -keystore app/release.keystore -alias lqmaster -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=LQ Master, OU=Dev, O=Apex, L=Hanoi, S=Hanoi, C=VN"

      - name: 6. Build APK Release
        run: ./gradlew assembleRelease

      - name: 7. Upload APK lên GitHub
        uses: actions/upload-artifact@v4
        with:
          name: LQ-Master-Optimizer-APK
          path: app/build/outputs/apk/release/app-release.apk
