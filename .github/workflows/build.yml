name: Build LQ Master APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Cho phép chạy thủ công từ tab Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Cài đặt JDK 17 - BƯỚC QUAN TRỌNG NHẤT
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2. Chấp nhận giấy phép Android SDK
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      # 3. Cấp quyền thực thi cho gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. (Tùy chọn) Tăng bộ nhớ cho Gradle nếu build Release bị lỗi OOM
      # - name: Increase Gradle memory
      #   run: |
      #     echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=512m" >> gradle.properties

      # 5. Build APK (bản debug để test)
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 6. Tải lên APK đã build
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LQ-Master-Optimizer-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
